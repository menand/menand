name: Snake Animation

on:
  # каждые 12 часов
  schedule:
    - cron: "0 */12 * * *"
  # ручной запуск из вкладки Actions
  workflow_dispatch:
  # при пуше в main
  push:
    branches:
      - main

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      # рисуем SVG-змейку из графика контрибуций пользователя
      - name: Generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # публикуем результат в ветку output
      # файлы будут доступны по адресу
      # https://raw.githubusercontent.com/<owner>/<repo>/output/<file>
      - name: Push svg to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
